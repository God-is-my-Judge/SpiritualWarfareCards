<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">Bronze Sea: one line inside the rim</title>
<desc id="desc">Schematic basin with a lily-flared thick rim. A single blue closed measuring line follows its inner wall. Supports are omitted to keep the hint clear; the companion oxen plan shows their arrangement. Perspective is schematic and dimensions are not to scale.</desc>
