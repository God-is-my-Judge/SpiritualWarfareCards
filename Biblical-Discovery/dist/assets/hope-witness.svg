<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 118" role="img" aria-labelledby="title desc">
 <title id="title">Two passages in Paul’s letters</title>
 <desc id="desc">In First Corinthians Paul names Peter and James among those who saw Jesus alive. In Galatians Paul describes later meeting both men.</desc>
