<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 104" role="img" aria-labelledby="title desc">
 <title id="title">Reading Pilate’s name</title>
 <desc id="desc">A field sketch picks out PILATVS on the damaged stone and connects the letters to the name Pilate.</desc>
 <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#ad9c77" stroke-width=".7"/></pattern></defs>
 <path d="m17 18 18-8 32 4 11-4 78 3 12 12-5 15 7 12-6 31-19 9-120-2-8-15 5-16-8-12 7-12z" fill="#e5d9bb" stroke="#70654e" stroke-width="1.4"/>
 <path d="m17 18 18-8 10 12-10 14 5 10-14 17 4 16-5 11-8-15 5-16-8-12 7-12z" fill="url(#hatch)"/>
 <g fill="none" stroke="#9b8c6e" stroke-width="1.3"><path d="M52 29l29 1m7-1 42 .5m-90 36 40 1 10-1 36 .5m-72 7 26 1m12 0 13 .4"/></g>
 <text x="48" y="53" font-size="17" letter-spacing="1" fill="#343a30" font-family="Georgia,serif">… PILATVS</text>
 <g stroke="#926341" fill="none"><path d="M79 58h57l37-23h21"/><circle cx="79" cy="58" r="2" fill="#926341"/></g>
 <text x="199" y="39" font-size="18" font-family="Georgia,serif" fill="#354538">Pilate</text>
 <text x="199" y="57" font-size="12" font-family="sans-serif" fill="#504d3e">a surviving name</text>
</svg>
